name: Karsa Jobs CI (Backend)
on:
  push:
    branches: [ karsajobs ]  # Trigger on pushes to the 'karsajobs' branch

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0  # Runs Hadolint on the Dockerfile:contentReference[oaicite:19]{index=19}
        with:
          dockerfile: ./Dockerfile

  test-app:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v5          # Set up Go environment:contentReference[oaicite:20]{index=20}
        with:
          go-version: '1.20'
      - name: Run Tests
        run: |
          go test -v -short --count=1 $(go list ./...)

  build-and-push:
    name: Build and Push Docker Image
    needs: [lint-dockerfile, test-app]
    runs-on: ubuntu-latest
    permissions: # Tambahkan block permissions
      contents: read
      packages: write # Izinkan akses write ke package registry
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/karsajobs:latest
            ghcr.io/${{ github.repository_owner }}/karsajobs:${{ github.sha }}