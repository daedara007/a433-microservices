name: Karsa Jobs CI (Backend)

permissions:
  contents: read      # tetap hanya read untuk kode
  packages: write     # grant write pada GHCR

on:
  push:
    branches: [ karsajobs ]  # Trigger on pushes to the 'karsajobs' branch

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0  # Runs Hadolint on the Dockerfile:contentReference[oaicite:19]{index=19}
        with:
          dockerfile: ./Dockerfile

  test-app:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v5          # Set up Go environment:contentReference[oaicite:20]{index=20}
        with:
          go-version: '1.20'
      - name: Run Tests
        run: |
          go test -v -short --count=1 $(go list ./...)

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, test-app]

    env:
      GITHUB_USER: ${{ github.repository_owner }}   # org/username pemilik repo
      CR_PAT:       ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      - name: Grant execute permission
        run: chmod +x build_push_image_karsajobs.sh

      - name: Build and Push Backend Image
        run: bash build_push_image_karsajobs.sh