name: Karsa Jobs CI (Backend)
on:
  push:
    branches: [ karsajobs ]

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile

  test-app:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: Run Tests
        run: |
          go test -v -short --count=1 $(go list ./...)

  build-and-push:
    name: Build and Push Docker Image
    needs: [lint-dockerfile, test-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Docker Login to GHCR
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        run: echo "$CR_PAT" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
      - name: Build and Push Backend Image
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: bash build_push_image_karsajobs.sh